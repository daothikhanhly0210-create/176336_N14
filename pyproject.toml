[project]
name = "diabetic-retinopathy-brset"
version = "0.1.0"
description = "Phan loai muc do benh vong mac dai thao duong (Diabetic Retinopathy) tren bo du lieu BRSET"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["diabetic-retinopathy", "brset", "fundus", "deep-learning", "grad-cam"]

dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "albumentations>=1.4",
    "opencv-python>=4.8",
    "numpy>=1.24,<3",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "grad-cam>=1.4.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "black>=24.0"]

[tool.setuptools]
packages = ["src"]

# ---------------------------------------------------------------------------
# Pytest: run `pytest` from the project root, it imports `src` from there.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

# ---------------------------------------------------------------------------
# Style
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
